appId: com.ba55ick.daw-buddy
productName: DAW Buddy
copyright: Copyright © 2026 ba55ick

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

win:
  # No arch list here on purpose: an arch list in the config overrides the
  # --x64 / --arm64 command-line flags, and with two archs NSIS also emits a
  # combined installer twice the size. dist:win and release.yml run one
  # build per arch (x64, then arm64) instead.
  target:
    - target: nsis

nsis:
  # One installer per architecture, named by it.
  artifactName: ${productName} Setup ${version} ${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DAW Buddy
  uninstallDisplayName: DAW Buddy

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.music
  # No Developer ID certificate yet (docs/proposals/0003-code-signing.md), so
  # sign ad-hoc. Without any signature the bundle is unsealed and Apple Silicon
  # reports a downloaded copy as "damaged and can't be opened", with no way to
  # open it. An ad-hoc signature turns that into the normal "unidentified
  # developer" prompt, which the user can approve.
  identity: "-"
  # Hardened runtime only matters for notarization; with an ad-hoc signature it
  # makes library validation reject Electron's own frameworks at launch.
  hardenedRuntime: false

linux:
  maintainer: ba55ick <hpkalas@gmail.com>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Audio
  synopsis: Fast project browser, key/scale analyzer, stem manager and audio organizer for music producers
  description: The intelligent desktop companion built specifically for music producers, sound designers, and audio engineers.
  desktop:
    entry:
      StartupWMClass: daw-buddy
      Categories: AudioVideo;Audio;Music;
      MimeType: application/x-ableton-live-set;application/x-fl-studio-project;audio/x-wav;audio/mpeg;

