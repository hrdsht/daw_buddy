appId: com.hrdsht.daw-buddy
productName: DAW Buddy

# The app runs the compiled output in dist/, plus package.json (for "main")
# and its production dependencies (chokidar). Everything else — src, tests,
# docs — is left out of the installer.
directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# Windows: a normal NSIS installer.
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS: a .dmg. Unsigned for now — see docs/proposals for the signing plan.
mac:
  target:
    - dmg
  category: public.app-category.music

# Bonus: a Linux AppImage from the same source.
linux:
  target:
    - AppImage
  category: Audio
