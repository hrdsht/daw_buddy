appId: com.ba55ick.daw-buddy
productName: DAW Buddy
copyright: Copyright © 2026 ba55ick

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: DAW Buddy
  uninstallDisplayName: DAW Buddy

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.music

linux:
  maintainer: ba55ick <contact@dawbuddy.app>
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Audio
  synopsis: Fast project browser, key/scale analyzer, stem manager and audio organizer for music producers
  description: The intelligent desktop companion built specifically for music producers, sound designers, and audio engineers.
  desktop:
    entry:
      StartupWMClass: daw-buddy
      Categories: AudioVideo;Audio;Music;
      MimeType: application/x-ableton-live-set;application/x-fl-studio-project;audio/x-wav;audio/mpeg;

