<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' data: blob: file:; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob: file: *; img-src 'self' data: blob: file:; script-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAW Buddy</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash" aria-label="DAW Buddy is starting">
      <video
        id="splashVideo"
        class="splash__video"
        autoplay
        muted
        playsinline
        preload="auto"
      >
        <source src="assets/splash-screen.mp4" type="video/mp4" />
        <source src="assets/splash.mp4" type="video/mp4" />
        <source src="assets/splash%20screen.mp4" type="video/mp4" />
      </video>
      <div class="splash__fallback" id="splashFallback" style="display: none;">
        <img src="assets/dawbuddy-logo-v2.png" alt="DAW Buddy" class="splash__logo" />
      </div>
      <button class="splash__skip" id="splashSkipBtn" type="button" title="Skip intro video">Skip &#10005;</button>
      <div class="splash__status"><span></span>Starting DAW Buddy…</div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
