<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' data: blob: file:; img-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DAW Buddy</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <main class="splash" aria-label="DAW Buddy is starting">
      <video
        id="splashVideo"
        class="splash__video"
        src="assets/splash%20screen.mp4"
        autoplay
        muted
        playsinline
        preload="auto"
      ></video>
      <div class="splash__fallback" id="splashFallback" style="display: none;">
        <img src="assets/dawbuddy-logo-v2.png" alt="DAW Buddy" class="splash__logo" />
      </div>
      <div class="splash__status"><span></span>Scanning your projects…</div>
    </main>
    <script src="splash.js"></script>
  </body>
</html>
