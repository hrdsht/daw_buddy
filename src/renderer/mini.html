<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAW Buddy — Mini Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mini.css">
</head>
<body class="mini-body">
  <div class="mini-container">
    <div class="mini-header" data-drag-region>
      <div class="mini-brand">
        <span class="mini-dot"></span>
        <span class="mini-title" id="miniTitle">No audio loaded</span>
      </div>
      <div class="mini-header-actions">
        <button class="mini-btn-icon" id="miniMinimizeMain" title="Minimize DAW Buddy main window">🗕</button>
        <button class="mini-btn-icon" id="miniExpand" title="Restore / Open DAW Buddy">↗</button>
        <button class="mini-btn-icon" id="miniClose" title="Hide Mini Player">✕</button>
      </div>
    </div>

    <div class="mini-sub" id="miniProject">—</div>

    <div class="mini-wave-wrap" id="miniWaveWrap">
      <canvas id="miniWave" class="mini-wave"></canvas>
      <div class="mini-playhead" id="miniPlayhead"></div>
    </div>

    <div class="mini-controls">
      <div class="mini-left-controls">
        <button class="mini-play-btn" id="miniPlayPause" title="Play / Pause (Space)">▶</button>
        <button class="mini-toggle" id="miniRepeat" title="Repeat song (Loop)">🔁 Repeat</button>
        <span class="mini-time" id="miniTime">0:00 / 0:00</span>
      </div>

      <div class="mini-right-controls">
        <button class="mini-drag-pill" id="miniDragBtn" draggable="true" title="Drag file directly into DAW track or folder">⤓ Drag</button>
      </div>
    </div>
  </div>
  <script src="mini.js"></script>
</body>
</html>
