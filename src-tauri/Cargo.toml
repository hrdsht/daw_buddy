[package]
name = "daw-buddy"
version = "0.0.0"
description = "DAW Buddy — Rust back end (Tauri). See docs/proposals/0007-rust-tauri-port.md"
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "daw_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
dirs = "7.0.0"
projectconvert = { path = "../crates/projectconvert" }
catalogue = { path = "../crates/catalogue" }
