name: Release

# Tag-driven auto-release. The single source of truth is package.json version:
#
#     npm version <patch|minor|major>      # bumps package.json + creates tag vX.Y.Z
#     git push origin main --follow-tags   # pushes the commit AND the tag
#
# Pushing the tag triggers this workflow, which:
#   1. refuses to release if the tag != package.json version (no drift, ever),
#   2. creates the GitHub release, marked Latest, with auto-generated notes,
#   3. builds the Electron installers on macOS/Windows/Linux and attaches them,
#   4. builds the Rust (Tauri) installers and attaches them next to those.
#
# There is no manual "create a release" step, so two people can't race and skip
# a version (which is how v0.3.0 got skipped).
#
# Run by hand (workflow_dispatch):
#   - with no tag: a dry run. Builds everything and uploads workflow artifacts,
#     touches no release.
#   - with the tag of an existing release: builds the Rust installers from that
#     tag, attaches them, and marks that release Latest. Use it for a release
#     that went out before the Rust build was part of this workflow. It never
#     creates a release or a tag.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to add the Rust installers to and mark Latest (e.g. v0.5.1-rust.0). Leave empty for a dry run.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    # Only on a tag push. Guards version↔tag, then creates the release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — the tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Release with 'npm version' so the two never drift."
            exit 1
          fi

      - name: Create the release (idempotent, auto-generated notes)
        # Not --prerelease: GitHub never shows a pre-release as "Latest" on the
        # repository page, so every release stayed hidden behind the one that
        # was promoted by hand.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --latest --generate-notes --verify-tag \
              --title "DAW Buddy $GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    # create-release is skipped on push to main or workflow_dispatch (no tag); still build then.
    # Not when run by hand for an existing tag: its Electron installers are already attached.
    if: always() && !inputs.tag && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build installers (dmg, AppImage/deb/rpm)
        if: runner.os != 'Windows'
        run: npm run dist -- --publish never

      - name: Build Windows installers (x64 and arm64, one each)
        # Two runs: asked for both archs at once, electron-builder makes one
        # combined installer twice the size.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --arm64 --publish never

      - name: Verify the macOS apps are signed
        # An unsigned arm64 bundle is rejected as "damaged" once downloaded.
        # Fail the build rather than ship one.
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::No .app bundle found under release/mac*"
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign --display --verbose=2 "$app" 2>&1 | grep -E "^(Identifier|Signature|CodeDirectory)"
          done

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.tar.gz release/*.zip)
          if [ ${#files[@]} -gt 0 ]; then
            echo "Uploading: ${files[*]}"
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            echo "No matching release files found to upload on this runner."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifacts (exe, dmg, linux packages)
        uses: actions/upload-artifact@v4
        with:
          name: daw-buddy-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.zip
          if-no-files-found: warn

  # The Rust (Tauri) app — proposal 0007. Same screens as the Electron app, with
  # the parts already ported running in Rust. Files are named DAW.Buddy.Rust_…
  # so they can't be mistaken for (or overwrite) the Electron installers.
  tauri:
    needs: [create-release]
    # Tag releases and manual runs only. Push to main is covered by ci.yml,
    # which builds and smoke-tests the Rust app on Linux.
    if: >-
      always() &&
      (needs.create-release.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.create-release.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          # NSIS only: MSI (WiX) refuses a version with a non-numeric
          # pre-release part such as 0.5.1-rust.0.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          # Pinned: the WebKitGTK package names below are checked on 24.04.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    env:
      # The release this run attaches to; empty on a dry run.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Guard — the tag must match package.json version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$PKG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $PKG."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System libraries for Tauri (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev file

      - name: Rust target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Build the Rust app
        # Tauri reads the version from package.json and runs the web UI build
        # itself (beforeBuildCommand). macOS: sign ad-hoc ("-"), for the same
        # reason as the Electron app — an unsigned download is reported as
        # "damaged" on Apple Silicon.
        # .rpm refuses a version with a "-" in it (0.5.1-rust.0), so skip it
        # for pre-release versions; the .deb and .AppImage still ship.
        shell: bash
        run: |
          bundles="${{ matrix.bundles }}"
          if [[ "$(node -p "require('./package.json').version")" == *-* ]]; then
            bundles="${bundles%,rpm}"
          fi
          npx --yes @tauri-apps/cli@2.12.4 build --ci \
            --target ${{ matrix.target }} \
            --bundles "$bundles" \
            --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'

      - name: Collect and name the installers
        shell: bash
        run: |
          shopt -s nullglob
          mkdir -p rust-release
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          bundle="target/${{ matrix.target }}/release/bundle"
          for f in "$bundle"/dmg/*.dmg "$bundle"/nsis/*.exe "$bundle"/deb/*.deb "$bundle"/rpm/*.rpm "$bundle"/appimage/*.AppImage; do
            base="$(basename "$f")"
            cp "$f" "rust-release/DAW.Buddy.Rust_${base#DAW Buddy[_-]}"
          done
          # The macOS .app is a folder; ship it zipped as well as in the dmg.
          for app in "$bundle"/macos/*.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            ditto -c -k --keepParent "$app" "rust-release/DAW.Buddy.Rust_$(node -p "require('./package.json').version")_${arch}.app.zip"
          done
          ls -la rust-release
          if [ -z "$(ls rust-release)" ]; then
            echo "::error::No Rust installers were produced under $bundle"
            exit 1
          fi

      - name: Attach the Rust installers to the release
        if: env.RELEASE_TAG != ''
        shell: bash
        run: gh release upload "$RELEASE_TAG" rust-release/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the Rust installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daw-buddy-rust-${{ matrix.target }}
          path: rust-release/*
          if-no-files-found: error

  # Manual run for an existing tag: once its Rust installers are attached, make
  # that release the one the repository page shows as Latest.
  promote:
    needs: [tauri]
    if: github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.tauri.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the release Latest
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
