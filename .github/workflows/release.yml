name: Release

# Builds installers when you publish a GitHub Release, and uploads the
# .exe / .dmg / AppImage to that release. A macOS .dmg can only be built on
# macOS, so the job fans out across runners.
#
# Also runnable on demand (workflow_dispatch): same three-runner build, but the
# installers go to workflow artifacts instead of a release — so mac/Windows
# packaging can be dry-run before ever tagging a public version.
on:
  release:
    types: [published]
  workflow_dispatch:

# Upload release assets with the built-in GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Don't let one platform's failure cancel the others — a broken Windows
      # build shouldn't throw away finished mac/Linux installers.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      # electron-builder runs `npm run build` shape via the dist script, then
      # packages dist/ + prod deps into release/. We never let electron-builder
      # publish: its GitHub provider derives the tag from package.json version
      # (v0.2.0), which won't match a pre-release tag like v0.2.0-rc.1 — it would
      # try to create a second release. Instead we attach to the exact release
      # that triggered the run, below. Unsigned for now — see docs/proposals/0003.
      - name: Build installers
        run: npm run dist -- --publish never

      # Attach to the triggering release by its real tag (rc or final), so the
      # version/tag naming never has to line up with package.json.
      - name: Attach installers to the release
        if: github.event_name == 'release'
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage)
          echo "Uploading: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}

      - name: Upload installers as artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: warn
