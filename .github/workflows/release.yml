name: Release

# Tag-driven auto-release. The single source of truth is package.json version:
#
#     npm version <patch|minor|major>      # bumps package.json + creates tag vX.Y.Z
#     git push origin main --follow-tags   # pushes the commit AND the tag
#
# Pushing the tag triggers this workflow, which:
#   1. refuses to release if the tag != package.json version (no drift, ever),
#   2. creates the GitHub pre-release with auto-generated notes,
#   3. builds installers on macOS/Windows/Linux and attaches them.
#
# There is no manual "create a release" step, so two people can't race and skip
# a version (which is how v0.3.0 got skipped). Also runnable on demand
# (workflow_dispatch) as a dry-run: it builds and uploads artifacts, no release.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    # Only on a tag push. Guards version↔tag, then creates the release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard — the tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG. Release with 'npm version' so the two never drift."
            exit 1
          fi

      - name: Create the pre-release (idempotent, auto-generated notes)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — reusing it."
          else
            gh release create "$GITHUB_REF_NAME" \
              --prerelease --generate-notes --verify-tag \
              --title "DAW Buddy $GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [create-release]
    # create-release is skipped on push to main or workflow_dispatch (no tag); still build then.
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build installers (exe, dmg, AppImage/deb/rpm)
        run: npm run dist -- --publish never

      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          shopt -s nullglob
          files=(release/*.dmg release/*.exe release/*.AppImage release/*.deb release/*.rpm release/*.tar.gz release/*.zip)
          echo "Uploading: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers as artifacts (exe, dmg, linux packages)
        uses: actions/upload-artifact@v7
        with:
          name: daw-buddy-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.zip
          if-no-files-found: warn
