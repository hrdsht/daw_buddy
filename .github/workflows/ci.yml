name: CI

# Fast feedback on every push and pull request: type-check both tsconfigs and
# run the lib-level test suite. No Electron, no packaging — that lives in
# release.yml and only runs when a Release is published.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # The Rust / Tauri build (proposal 0007): lint, unit tests, byte-for-byte
  # parity with the TypeScript converter, and a WebDriver smoke test of the
  # real app on a virtual display.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: System libraries for Tauri (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the web UI the app embeds
        run: npm run build:renderer && node scripts/copy-assets.js

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Parity with the TypeScript converter
        run: npm run rust:parity

      - name: Smoke test the Tauri app
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          cargo build -p daw-buddy
          xvfb-run -a node scripts/tauri-smoke.js
