name: CI

# Fast feedback on every push and pull request: type-check both tsconfigs and
# run the lib-level test suite. No Electron, no packaging — that lives in
# release.yml and only runs when a Release is published.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
